name: XEROTV CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install --legacy-peer-deps --no-audit --no-fund --loglevel=error

      - name: TypeScript type check
        run: npm run lint

      - name: ESLint security check
        run: npx eslint .

      - name: Unit tests
        run: npx tsx --test src/utils/appLinks.test.ts src/utils/modes.test.ts src/utils/subscription.test.ts

      - name: Production Vite build
        run: npm run build
